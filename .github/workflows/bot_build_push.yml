# This workflow was used with the Web Service demployment and is now here just for reference.
name: Bot Build & Push
on:
  workflow_dispatch:
env:
  ACR_USR: massibotregistry
  ACR_REG: massibotregistry.azurecr.io
  ACR_IMG: massibotregistry.azurecr.io/massibot-graph
jobs:
  build_and_push:
    name: Build & Push
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
    - name: Checkout bot folder
      uses: actions/checkout@v4
      with:
        sparse-checkout: bot
    - name: Build and tag image
      working-directory: bot
      run: |
        pip install -U langgraph-cli
        langgraph build -t $ACR_IMG
    - name: Login to ACR
      uses: docker/login-action@v3
      with:
        registry: ${{env.ACR_REG}}
        username: ${{env.ACR_USR}}
        password: ${{secrets.ACR_PWD}}
    - name: Push image
      run: docker push $ACR_IMG