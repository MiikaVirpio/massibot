# This workflow was used with the Web Service demployment and is now here just for reference.
name: Web Build & Deploy
on:
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web folder
        uses: actions/checkout@v4
        with:
          sparse-checkout: web
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up venv
        run: |
          python -m venv venv
          source venv/bin/activate
      - name: Install dependencies
        working-directory: web
        run: pip install -r requirements.txt
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            web
            !venv/

  deploy_production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: ${{steps.deploy-to-webapp.outputs.webapp-url}}
    permissions:
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{secrets.AZURE_CLIENT}}
          tenant-id: ${{secrets.AZURE_TENANT}}
          subscription-id: ${{secrets.AZURE_SUBSCRIPTION}}
      - name: Deploy Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: massibot
          slot-name: Production