<!-- Use Live Server extension in VSCode ("Go Live" at the bottom) and open this file. Handy way to test Htmx, Bootsrap, etc. -->
<!DOCTYPE HTML>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <meta name="htmx-config" content='{"selfRequestsOnly": false}'>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
    <title>Scratch</title>
</head>
<body data-bs-theme="dark">
    <div class="d-flex flex-column" style="height: 100vh;">
        <div class="gradient-bg">
            <div class="container" style="max-width: 576px;">
                <nav class="navbar ps-2">
                    <a href="#" class="navbar-brand">
                        <span>MassiBot</span>    
                    </a>
                    <span class="navbar-text">
                        <button class="btn bi bi-person-fill" style="font-size: 1.5rem;" data-bs-toggle="offcanvas" data-bs-target="#offcanvasProfile" aria-controls="offcanvasProfile"></button>
                        <button class="btn bi bi-gear-fill" style="font-size: 1.5rem;" data-bs-toggle="offcanvas" data-bs-target="#offcanvasSettings" aria-controls="offcanvasSettings"></button>
                    </span>
                </nav>
            </div>
        </div>
        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasProfile" aria-labelledby="offcanvasProfileLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="offcanvasProfileLabel">Profile</h5>
                <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <div class="container">
                    <p class="text-center">This content of Profile modal</p>
                </div>
            </div>
        </div>
        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasSettings" aria-labelledby="offcanvasSettingsLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="offcanvasSettingsLabel">Settings</h5>
                <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <div class="container">
                    <p class="text-center">This content of Settings modal</p>
                </div>
            </div>
        </div>
        <div class="d-flex flex-column flex-grow-1 justify-content-end gradient-bg" style="height: 10rem;">
            <div id="messages" class="container overflow-y-scroll" style="max-width: 576px;">
                <div class="d-flex justify-content-end me-2">
                    <p class="col-11 card bg-light text-dark p-2">Hello this is the human speaking</p>
                </div>
                <div class="d-flex flex-column align-items-start ms-2">
                    <p class="bg-transparent text-light">Thinking...</p>
                    <p class="col-11 card bg-dark text-light p-2">SSE enables servers to push real-time updates to clients.</p>
                </div>
            </div>
        </div>
        <div class="gradient-bg">
            <span id="temptarget"></span>
            <div class="container p-2" style="max-width: 576px;">
                <form class="input-group" style="height: 8rem;">
                    <textarea name="user-message" id="user-message" class="form-control bg-light text-dark"></textarea>
                    <span type="submit" class="input-group-text btn btn-secondary">
                        <i class="bi bi-send" style="font-size: 1.5rem;"></i>
                    </span>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
