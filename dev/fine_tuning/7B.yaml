# data
data:
  instruct_data: "/home/miika/repo/mistral-finetune/data/semigenerated1_train.jsonl"  # Fill
  data: ""  # Optionally fill with pretraining data 
  eval_instruct_data: "/home/miika/repo/mistral-finetune/data/semigenerated1_eval.jsonl"  # Optionally fill

# model
model_id_or_path: "/home/miika/repo/mistral-finetune/mymodels/7Bv3"
lora:
  rank: 64

# optim
seq_len: 1024
batch_size: 1
max_steps: 300
optim:
  lr: 6.e-5
  weight_decay: 0.1
  pct_start: 0.05

# other
seed: 0
log_freq: 1
eval_freq: 100
no_eval: False
ckpt_freq: 100

save_adapters: True  # save only trained LoRA adapters. Set to `False` to merge LoRA adapter into the base model and save full fine-tuned model

run_dir: "/home/miika/repo/mistral-finetune/mymodels/lora/3"  # Fill

wandb:
  project: "finemistral"
  run_name: "run3"
  key: "wandb_key"  # Fill with your wandb key
  offline: False

